<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111417" />
    <title>دونینو | پنل مدیریت شبکه</title>
    <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <section id="login-view" class="login-view" hidden>
      <form id="bootstrap-form" class="login-form" hidden>
        <img src="/static/logo.svg" alt="" width="44" height="44" />
        <h2>حساب مالک شبکه را بساز</h2>
        <p class="muted">
          این لینک یک‌بارمصرف است و پس از ساخت اولین مدیر بسته می‌شود.
        </p>
        <label
          >نام کاربری<input
            name="owner_username"
            autocomplete="username"
            required
            maxlength="64"
            dir="ltr"
        /></label>
        <label
          >رمز جدید<input
            name="owner_password"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            maxlength="256"
            dir="ltr"
        /></label>
        <label
          >تکرار رمز<input
            name="confirm"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            maxlength="256"
            dir="ltr"
        /></label>
        <p id="bootstrap-error" role="alert" class="error"></p>
        <button class="primary" type="submit">ساخت حساب و ورود</button>
      </form>
      <form id="login-form" class="login-form">
        <img src="/static/logo.svg" alt="" width="44" height="44" />
        <h2>ورود به دونینو</h2>
        <p class="muted">با حساب مدیریت خود وارد شوید.</p>
        <label
          >نام کاربری<input
            name="username"
            autocomplete="username"
            required
            maxlength="64"
            dir="ltr" /></label
        ><label
          >رمز عبور<input
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="256"
            dir="ltr"
        /></label>
        <label id="code-field" hidden
          >کد دو مرحله‌ای یا بازیابی<input
            name="code"
            autocomplete="one-time-code"
            inputmode="text"
            maxlength="32"
            dir="ltr"
        /></label>
        <p id="login-error" role="alert" class="error"></p>
        <button class="primary" type="submit">ورود</button>
        <small class="muted">پیش‌نمایش ۱.۰ آلفا ۳</small>
      </form>
    </section>
    <div id="app-view" class="shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="#overview">
          <img src="/static/logo.svg" alt="" />
          <span>دونینو<small>پنل مدیریت شبکه</small></span>
        </a>
        <nav aria-label="منوی اصلی">
          <a href="#overview" data-page="overview"
            ><span data-icon="overview"></span>نمای کلی</a
          >
          <a href="#users" data-page="users"
            ><span data-icon="users"></span>کاربران</a
          >
          <a href="#nodes" data-page="nodes"
            ><span data-icon="nodes"></span>نودها</a
          >
          <a href="#inbounds" data-page="inbounds"
            ><span data-icon="inbounds"></span>اتصال‌ها</a
          >
          <a href="#audit" data-page="audit" data-owner
            ><span data-icon="events"></span>رویدادها</a
          >
          <a href="#settings" data-page="settings"
            ><span data-icon="settings"></span>تنظیمات</a
          >
        </nav>
        <div class="sidebar-bottom">
          <div class="version-card">
            <b>Donino</b><small>پیش‌نمایش ۱.۰ آلفا ۳</small>
          </div>
          <div class="account">
            <span class="avatar" id="account-initial">D</span>
            <div>
              <b id="account-name"></b><small id="account-role"></small>
            </div>
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            <b id="breadcrumb">نمای کلی</b>
            <span id="sync-status" class="muted">در حال دریافت…</span>
          </div>
          <div class="top-actions">
            <button
              id="refresh"
              class="icon-button"
              aria-label="به‌روزرسانی"
              title="به‌روزرسانی"
            >
              <span data-icon="refresh"></span>
            </button>
            <button
              id="theme"
              class="icon-button"
              aria-label="تغییر حالت روشن و تیره"
              title="تغییر حالت نمایش"
            >
              <span data-icon="theme"></span>
            </button>
            <button
              id="logout"
              class="icon-button"
              data-action="logout"
              aria-label="خروج از حساب"
              title="خروج"
            >
              <span data-icon="logout"></span>
            </button>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
      </div>
    </div>
    <dialog id="modal">
      <div class="modal-heading">
        <h2 id="modal-title"></h2>
        <button id="close-modal" class="icon-button" aria-label="بستن">
          <span data-icon="close"></span>
        </button>
      </div>
      <div id="modal-body"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
