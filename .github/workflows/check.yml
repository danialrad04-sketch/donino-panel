name: Check Donino
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api-and-xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_xray.py /tmp/donino-xray
      - run: DONINO_TEST_XRAY=/tmp/donino-xray/xray python -m unittest discover -s tests -v
      - run: node --check app/static/app.js
      - run: node --check app/static/portal.js
      - run: node --check app/static/foundation.js
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_PASSWORD: donino-ci-only
          POSTGRES_DB: donino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d donino_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DONINO_TEST_POSTGRES: postgresql://postgres:donino-ci-only@127.0.0.1:5432/donino_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_postgres.py -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
