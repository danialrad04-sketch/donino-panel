name: Check Donino
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api-and-xray:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unbound
      - run: sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /var/lib/unbound/donino-tests
      - run: python scripts/release_manifest.py --check
      - run: python scripts/coordination.py check
      - run: python scripts/fetch_xray.py /tmp/donino-xray
      - run: DONINO_TEST_XRAY=/tmp/donino-xray/xray DONINO_TEST_UNBOUND=/usr/sbin/unbound DONINO_TEST_UNBOUND_ROOT=/var/lib/unbound/donino-tests python -m unittest discover -s tests -v
      - run: node --check app/static/app.js
      - run: node --check app/static/portal.js
      - run: node --check app/static/dns.js
      - run: node --check app/static/smart-dns.js
      - run: node --check app/static/tunnels.js
  tunnel-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt aiohttp==3.14.4 PyYAML==6.0.3
      - name: Fetch the reviewed Donino Tunnel contract source
        run: |
          git init /tmp/donino-tunnel-source
          git -C /tmp/donino-tunnel-source remote add origin https://github.com/danialrad04-sketch/donino-tunnel.git
          git -C /tmp/donino-tunnel-source fetch --depth 1 origin 4c19214598d32bd2868f9f46030d8a5dbd494d97
          git -C /tmp/donino-tunnel-source checkout --detach FETCH_HEAD
      - run: python -m unittest discover -s tests -p 'test_tunnel*.py' -v
        env:
          DONINO_TEST_TUNNEL_SOURCE: /tmp/donino-tunnel-source
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: donino_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client unbound
      - run: sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" /var/lib/unbound/donino-tests
      - run: pip install -r requirements.txt -r requirements-postgres.txt
      - run: python scripts/fetch_xray.py /tmp/donino-xray
      - run: DONINO_TEST_XRAY=/tmp/donino-xray/xray DONINO_TEST_UNBOUND=/usr/sbin/unbound DONINO_TEST_UNBOUND_ROOT=/var/lib/unbound/donino-tests DONINO_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/donino_test python -m unittest discover -s tests -v
  tunnel-vpn:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt aiohttp==3.14.4 PyYAML==6.0.3
      - name: Fetch reviewed tunnel source and verified real engines
        run: |
          git init /tmp/donino-tunnel-source
          git -C /tmp/donino-tunnel-source remote add origin https://github.com/danialrad04-sketch/donino-tunnel.git
          git -C /tmp/donino-tunnel-source fetch --depth 1 origin 4c19214598d32bd2868f9f46030d8a5dbd494d97
          git -C /tmp/donino-tunnel-source checkout --detach FETCH_HEAD
          PYTHONPATH=/tmp/donino-tunnel-source python -c "from donino_link.artifacts import install_engines; install_engines(['frp'], '/tmp/donino-frp')"
          python scripts/fetch_xray.py /tmp/donino-xray
          python scripts/fetch_mihomo.py /tmp/donino-mihomo
      - name: Real six-profile VPN transfer, carrier loss, restart and publication guards
        run: python -m unittest discover -s tests -p test_tunnel_vpn.py -v
        env:
          DONINO_TEST_TUNNEL_SOURCE: /tmp/donino-tunnel-source
          DONINO_TEST_FRP_DIR: /tmp/donino-frp
          DONINO_TEST_XRAY: /tmp/donino-xray/xray
          DONINO_TEST_MIHOMO: /tmp/donino-mihomo/mihomo
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
  native-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [debian12, ubuntu24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/native_acceptance.py --os ${{ matrix.os }}
        env:
          DOCKER_BUILDKIT: "1"
