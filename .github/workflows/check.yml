name: Check Donino
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api-and-xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_xray.py /tmp/donino-xray
      - run: DONINO_TEST_XRAY=/tmp/donino-xray/xray python -m unittest discover -s tests -v
      - run: node --check app/static/app.js
      - run: node --check app/static/portal.js
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: donino_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r requirements.txt -r requirements-postgres.txt
      - run: python scripts/fetch_xray.py /tmp/donino-xray
      - run: DONINO_TEST_XRAY=/tmp/donino-xray/xray DONINO_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/donino_test python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
